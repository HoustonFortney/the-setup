name: Test playbook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  molecule-test-fresh-install:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Initialize uv environment
        run: uv sync

      - name: Run Molecule tests
        run: uv run molecule test

  molecule-test-upgrade:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Initialize uv environment
        run: uv sync

      - name: Materialize base version
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          echo "Applying base state from $BASE_SHA before the current playbook"
          git fetch --depth 1 origin "$BASE_SHA"
          git worktree add "$RUNNER_TEMP/upgrade-base" "$BASE_SHA"

      - name: Run Molecule upgrade test
        env:
          UPGRADE_BASE_PLAYBOOK: ${{ runner.temp }}/upgrade-base/playbook.yaml
        run: uv run molecule test -s upgrade
