---
- name: Copy bash configuration file
  ansible.builtin.copy:
    src: ".bashrc_local"
    dest: "{{ ansible_env.HOME }}/.bashrc_local"
    mode: "0644"
    backup: true

- name: Ensure .bashrc sources .bashrc_local
  become: false
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: "source ~/.bashrc_local"
    state: present

- name: Copy bash aliases file
  ansible.builtin.copy:
    src: ".bash_aliases"
    dest: "{{ ansible_env.HOME }}/.bash_aliases"
    mode: "0644"
    backup: true

- name: Copy readline configuration file
  ansible.builtin.copy:
    src: ".inputrc"
    dest: "{{ ansible_env.HOME }}/.inputrc"
    mode: "0644"
    backup: true
