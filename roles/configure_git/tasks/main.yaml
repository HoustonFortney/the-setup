---
- name: Set global git config
  community.general.git_config:
    scope: global
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  loop:
    - { name: core.editor, value: "nvim" }
    - { name: core.pager, value: "delta" }
    - { name: interactive.diffFilter, value: "delta --color-only" }
    - { name: delta.navigate, value: "true" }
    - { name: delta.line-numbers, value: "false" }
    - { name: delta.file-decoration-style, value: "none" }
    - { name: delta.file-modified-label, value: "" }
    - { name: delta.hunk-header-style, value: "omit" }
    - { name: delta.hunk-header-decoration-style, value: "none" }
    - { name: delta.syntax-theme, value: "Dracula" }
    - { name: push.default, value: "current" }
    - { name: pull.rebase, value: "true" }
    - { name: rebase.autoSquash, value: "true" }

- name: Set git aliases
  community.general.git_config:
    scope: global
    name: "alias.{{ item.name }}"
    value: "{{ item.value }}"
  loop:
    - { name: a, value: "add -u" }
    - { name: s, value: "status -sb" }
    - { name: l, value: "log --oneline --graph --decorate" }
    - { name: c, value: "commit" }
    - { name: cc, value: 'commit --trailer "Co-authored-by: Claude <noreply@anthropic.com>"' }
    - { name: amend, value: "commit --amend --no-edit" }
    - { name: fixup, value: "commit --fixup" }
    - { name: pushf, value: "push --force-with-lease" }

- name: Install lazygit
  become: true
  vars:
    lazygit_archive: "lazygit_{{ configure_git_lazygit_version }}_linux_{{ ansible_architecture }}.tar.gz"
  ansible.builtin.unarchive:
    src: "https://github.com/jesseduffield/lazygit/releases/download/v{{ configure_git_lazygit_version }}/{{ lazygit_archive }}"
    dest: /usr/local/bin
    remote_src: true
    include:
      - lazygit
    creates: /usr/local/bin/lazygit
    mode: "0755"

- name: Create lazygit config directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/lazygit"
    state: directory
    mode: "0755"

- name: Copy lazygit config
  ansible.builtin.copy:
    src: files/lazygit.yml
    dest: "{{ ansible_env.HOME }}/.config/lazygit/config.yml"
    mode: "0644"
    backup: true

- name: Add lazygit alias to bash
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: "alias lg='lazygit'"
    state: present
