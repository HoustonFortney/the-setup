---
- name: Remove legacy Alacritty PPA list file
  become: true
  # Older versions of this role used the apt_repository module, which wrote a
  # keyless .list file. It conflicts (Signed-By) with the deb822 .sources file
  # created by add-apt-repository below, breaking apt update.
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/ppa_aslatter_ppa_{{ ansible_distribution_release }}.list"
    state: absent

- name: Add apt repository for Alacritty
  become: true
  ansible.builtin.command:
    cmd: add-apt-repository -y ppa:aslatter/ppa
    creates: "/etc/apt/sources.list.d/aslatter-ubuntu-ppa-{{ ansible_distribution_release }}.sources"

- name: Install Alacritty
  become: true
  ansible.builtin.apt:
    name: alacritty
    state: present
    update_cache: true

- name: Create Alacritty config dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_env.HOME }}/.config/alacritty"
    - "{{ ansible_env.HOME }}/.config/alacritty/themes/dracula"

- name: Copy Alacritty configuration
  ansible.builtin.copy:
    src: "alacritty.toml"
    dest: "{{ ansible_env.HOME }}/.config/alacritty/alacritty.toml"
    mode: "0644"
    backup: true

- name: Download Dracula theme for Alacritty
  ansible.builtin.get_url:
    url: "https://github.com/dracula/alacritty/archive/master.zip"
    dest: "/tmp/dracula-alacritty.zip"
    mode: "0644"

- name: Unzip Dracula theme
  ansible.builtin.unarchive:
    src: "/tmp/dracula-alacritty.zip"
    dest: "{{ ansible_env.HOME }}/.config/alacritty/themes/dracula"
    remote_src: true
