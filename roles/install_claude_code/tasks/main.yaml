---
- name: Install Claude Code
  ansible.builtin.shell:
    cmd: "set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash"
    executable: /usr/bin/bash
    creates: "{{ ansible_env.HOME }}/.local/bin/claude"

- name: Create Claude Code config directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.claude"
    state: directory
    mode: "0755"

- name: Copy Claude Code status line script
  ansible.builtin.copy:
    src: "statusline.py"
    dest: "{{ ansible_env.HOME }}/.claude/statusline.py"
    mode: "0755"
    backup: true

- name: Copy Claude Code settings
  ansible.builtin.copy:
    src: "settings.json"
    dest: "{{ ansible_env.HOME }}/.claude/settings.json"
    mode: "0644"
    backup: true
