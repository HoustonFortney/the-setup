---
- name: Ensure fonts directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/fonts"
    state: directory
    mode: "0755"

- name: Download and unpack nerd font
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/{{ install_fonts_nerd_font }}.tar.xz
    dest: "{{ ansible_env.HOME }}/.local/share/fonts"
    creates: "{{ ansible_env.HOME }}/.local/share/fonts/{{ install_fonts_nerd_font }}NerdFont-Regular.ttf"
    remote_src: true
  notify: Update font cache
