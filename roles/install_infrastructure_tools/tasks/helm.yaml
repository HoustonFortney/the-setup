---
- name: Remove legacy Helm apt list file
  become: true
  # Superseded by the deb822 .sources file below. An older version of this role
  # used apt_repository, which wrote helm-stable-debian.list; leaving it causes
  # a conflicting Signed-By error in apt.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/helm-stable-debian.list
    state: absent

- name: Add Helm apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: helm-stable-debian
    uris: https://packages.buildkite.com/helm-linux/helm-debian/any/
    suites: any
    components: main
    signed_by: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
  register: install_infrastructure_tools_helm_repo

- name: Install helm
  become: true
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if install_infrastructure_tools_helm_repo is changed else 3600 }}"

- name: Enable helm bash completion
  become: false
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: "source <(helm completion bash)"
    state: present
