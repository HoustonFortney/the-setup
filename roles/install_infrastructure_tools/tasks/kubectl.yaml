---
- name: Remove legacy Kubernetes apt list file
  become: true
  # Superseded by the deb822 .sources file below. An older version of this role
  # used apt_repository, which wrote kubernetes.list; leaving it causes a
  # conflicting Signed-By error in apt.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/kubernetes.list
    state: absent

- name: Add Kubernetes apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: kubernetes
    uris: https://pkgs.k8s.io/core:/stable:/v{{ install_infrastructure_tools_kubectl_version }}/deb/
    suites: "/"
    signed_by: https://pkgs.k8s.io/core:/stable:/v{{ install_infrastructure_tools_kubectl_version }}/deb/Release.key

- name: Install kubectl
  become: true
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true
