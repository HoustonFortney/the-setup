---
- name: Remove legacy HashiCorp apt list file
  become: true
  # Superseded by the deb822 .sources file below. An older version of this role
  # used apt_repository, which wrote hashicorp.list; leaving it causes a
  # conflicting Signed-By error in apt.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/hashicorp.list
    state: absent

- name: Add HashiCorp repository
  become: true
  ansible.builtin.deb822_repository:
    name: hashicorp
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_distribution_release | lower }}"
    components: main
    architectures: amd64
    signed_by: https://apt.releases.hashicorp.com/gpg

- name: Install terraform
  become: true
  ansible.builtin.apt:
    name: terraform
    state: present
    update_cache: true

- name: Enable terraform bash completion
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: "complete -C '/usr/bin/terraform' terraform"
    state: present
