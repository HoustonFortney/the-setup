---
- name: Remove legacy NodeSource apt list file
  # Superseded by the deb822 .sources file below. An older version of this role
  # used apt_repository, which wrote nodesource.list; leaving it causes a
  # conflicting Signed-By error in apt.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent
  become: true

- name: Add NodeSource repo
  ansible.builtin.deb822_repository:
    name: nodesource
    uris: https://deb.nodesource.com/node_{{ install_nodejs_major_version }}.x
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
  become: true

- name: Install node
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  become: true

- name: Install global npm packages
  community.general.npm:
    name: "{{ item }}"
    global: true
  loop: "{{ install_nodejs_global_packages }}"
  become: true
