# Set prefix key
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# Use vi keybindings
set-option -g mode-keys vi
bind -n 'C-M-h' resize-pane -L 5
bind -n 'C-M-j' resize-pane -D 5
bind -n 'C-M-k' resize-pane -U 5
bind -n 'C-M-l' resize-pane -R 5

# Enable scroll with page up/down
bind -n PageUp copy-mode -u
bind -n PageDown send-keys Pagedown

# Start windows and panes at 1
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Keep window numbers contiguous
set-option -g renumber-windows on

# Fix escape delay
set-option -sg escape-time 10

# Enable focus events for editor autoread
set-option -g focus-events on

# Set the terminal title to the session name
set-option -g set-titles on
set-option -g set-titles-string '#S'

# Advertise true color support
set-option -as terminal-features ',xterm-256color:RGB'

# Enable mouse for initial pane focus
set -g mouse on

# Copy mode: vi-style selection, yank to the system clipboard via xclip
set-option -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'

# Create vertical split (stacked) with ctrl-t
bind-key -n 'C-t' split-window -v -l 30%

# Create horizontal split (side-by-side) with ctrl-y
bind-key -n 'C-y' split-window -h -l 50%

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @dracula-show-left-icon "tmux"
set -g @dracula-plugins " "

run -b '~/.tmux/plugins/tpm/tpm'

